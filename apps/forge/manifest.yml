modules:
  jira:issuePanel:
    - key: hae-trustflow-panel
      resource: trustflow-ui
      resolver:
        function: trustflow-resolver
      title: HAE TrustFlow
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: trustflow-resolver
      handler: index.handler
resources:
  - key: trustflow-ui
    path: src/ui/dist
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - read:page:confluence
  external:
    fetch:
      backend:
        - https://generativelanguage.googleapis.com
app:
  id: "ari:cloud:ecosystem::app/${FORGE_APP_ID}"
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  runtime:
    name: nodejs22.x
environment:
  variables:
    - FORGE_APP_ID
